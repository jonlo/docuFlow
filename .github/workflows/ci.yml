name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: typecheck

    env:
      VITE_API_URL: http://localhost:8787

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/e2e/package.json') }}

      # Chromium covers: chromium + mobile-chrome (Pixel 5)
      # WebKit covers:   mobile-safari (iPhone 14)
      # ubuntu-latest (24.04) stores main repos in ubuntu.sources (DEB822 format).
      # Third-party PPAs (deadsnakes, ondrej, toolchain-r, …) add .list files
      # and some return 403, aborting apt-get update inside playwright install.
      # Removing only .list files leaves ubuntu.sources intact so apt still works.
      - name: Install Playwright browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.list || true
          pnpm exec playwright install --with-deps chromium webkit
        working-directory: packages/e2e

      - name: Run E2E tests
        run: pnpm test
        working-directory: packages/e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7
