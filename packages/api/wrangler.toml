name = "flowdocs-api"
main = "src/index.ts"
compatibility_date = "2024-06-20"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "FLOWDOCS_KV"
id = "421a227b6a614b0db0ec96cfdb4b4f03"

[[d1_databases]]
binding = "DB"
database_name = "flowdocs-db"
database_id = "2ed20309-706e-40bc-9261-9e006951fefd"

[vars]
ENVIRONMENT = "development"

# Secrets — set via `wrangler secret put`:
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# CONFLUENCE_CLIENT_ID
# CONFLUENCE_CLIENT_SECRET
# NOTION_CLIENT_ID
# NOTION_CLIENT_SECRET
# SESSION_SECRET

[dev]
port = 8787
local_protocol = "http"
